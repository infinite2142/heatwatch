name: Publish HeatWatch to Pages

# The page is built on the mini and committed; this workflow only publishes it.
# It never writes to the repo -- a second writer is how MarketWatch lost a day.
#
# Deny-by-default publish surface, the same principle as .assetsignore on the
# Cloudflare side: the artifact is staged from an empty directory and gets
# index.html and nothing else. Publishing the repo root instead would serve
# generate_site.py and CLAUDE.md as well. Adding a runtime asset later means
# adding a cp line here, or it silently 404s.
on:
  push:
    branches: [master]
    paths:
      - "*.html"
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Two pushes minutes apart both queue on this group. The page is regenerated
# from scratch every run, so newest-wins is always correct here.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage the publish surface
        run: |
          mkdir -p _site
          # Still an allowlist, still deny-by-default -- the names are explicit.
          # A page absent from the build (health.html, until the run collects a
          # health section) is skipped rather than failing the publish.
          for f in index.html climate.html health.html workers.html fire.html solutions.html; do
            if [ -f "$f" ]; then cp "$f" _site/; else echo "skipped (not built): $f"; fi
          done
          echo "publishing:"; ls -la _site
          # Nothing else may reach the artifact. generate_site.py, globe.py,
          # world_paths.json and CLAUDE.md are build inputs, not pages.
          for leak in generate_site.py globe.py world_paths.json CLAUDE.md README.md; do
            if [ -e "_site/$leak" ]; then echo "::error::$leak reached the artifact"; exit 1; fi
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
