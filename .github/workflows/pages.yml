name: Publish HeatWatch to Pages

# The page is built on the mini and committed; this workflow only publishes it.
# It never writes to the repo -- a second writer is how MarketWatch lost a day.
#
# Deny-by-default publish surface, the same principle as .assetsignore on the
# Cloudflare side: the artifact is staged from an empty directory and gets
# index.html and nothing else. Publishing the repo root instead would serve
# generate_site.py and CLAUDE.md as well. Adding a runtime asset later means
# adding a cp line here, or it silently 404s.
on:
  push:
    branches: [master]
    paths:
      - "*.html"
      - "*.csv"
      - "preview.png"
      - "*.xml"
      - "robots.txt"
      - "archive/**"
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Two pushes minutes apart both queue on this group. The page is regenerated
# from scratch every run, so newest-wins is always correct here.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage the publish surface
        run: |
          mkdir -p _site
          # Still an allowlist, still deny-by-default -- the names are explicit.
          # A page absent from the build is skipped rather than failing the
          # publish: workability.html needs a stored forecast, so a day the fetch
          # did not run publishes Updates alone rather than nothing.
          cp index.html _site/index.html
          # The link preview card. og:image points at this absolute URL, so a 404
          # here is a link that unfurls with no image at all. It is optional in
          # the same way workability.html is: a build on a machine with no
          # headless Chrome has none to stage.
          if [ -f preview.png ]; then cp preview.png _site/preview.png; fi
          # Syndication. feed.xml is linked from both pages' <head>, sitemap.xml
          # is named by robots.txt, and robots.txt only takes effect once the site
          # has its own origin -- see robots_txt() for why it ships before then.
          for f in feed.xml sitemap.xml robots.txt; do
            if [ -f "$f" ]; then cp "$f" "_site/$f"; fi
          done
          # "if", not "[ -f x ] && cp": the runner is bash -e, and a test that
          # fails as the left side of && takes the exit status of the whole list
          # with it, so a missing optional file would fail the publish.
          if [ -f workability.html ]; then cp workability.html _site/workability.html; fi
          if [ -f workability-week.csv ]; then
            cp workability-week.csv _site/workability-week.csv
          fi
          # The archive is served as static JSON from the same origin, one file
          # per hub per date plus the published manifest of hashes. It is
          # append-only, so this copies the tree rather than naming files.
          if [ -d archive ]; then
            mkdir -p _site/archive
            cp -R archive/. _site/archive/
          fi
          echo "publishing:"; ls -la _site
          # Nothing else may reach the artifact. generate_site.py, globe.py,
          # world_paths.json and CLAUDE.md are build inputs, not pages.
          for leak in generate_site.py globe.py workability.py wbgt.py test_wbgt.py \
                      world_paths.json CLAUDE.md README.md make_preview.py; do
            if [ -e "_site/$leak" ]; then echo "::error::$leak reached the artifact"; exit 1; fi
          done
          # The archive carries only what the build wrote. Anything else under
          # it is a mistake, and a published mistake is permanent -- the whole
          # point of the manifest is that a past file can be shown unchanged.
          if [ -d _site/archive ]; then
            bad=$(find _site/archive -type f ! -name '*.json' -print -quit)
            if [ -n "$bad" ]; then echo "::error::non-JSON file in archive: $bad"; exit 1; fi
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
